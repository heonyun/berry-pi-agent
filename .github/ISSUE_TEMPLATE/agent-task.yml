name: Agent Task
description: Berry-pi-agent task for orchestrator workflow (plan / implement / review)
title: "[Task] "
labels: ["agent-task"]
body:
  - type: markdown
    attributes:
      value: |
        Repository: **heonyun/berry-pi-agent** only. For Antigravity-delegated issues, include `<!-- pi-agent:created-by:antigravity -->` in the body.

        `harness_flow` = workflow stage (plan / implement / review). **Not** the deployment environment.

        Writer prompt / CLI paste: `doc/orchestrator/issue-agent-prompts.md` § Writer · `docs/GITHUB_AGENT_COMMANDS.md` § New issue body.
        Mode sizing: `doc/orchestrator/issue-process-modes.md` · `docs/TASK_CLASSIFIER.md`.
        After create: `pwsh scripts/Test-IssueContractGate.ps1 -IssueNumber <N>` (required fields). Recommended: Behavioral Intent, Non-goals, Regression Risks, breadcrumbs.

  - type: dropdown
    id: harness_flow
    attributes:
      label: Harness flow
      description: Current workflow stage for this task
      options:
        - plan
        - implement
        - review
    validations:
      required: true

  - type: dropdown
    id: task_class
    attributes:
      label: Task class
      description: Risk and verification class (see docs/TASK_CLASSIFIER.md)
      options:
        - trivial
        - standard
        - complex
        - pr-loop-only
    validations:
      required: true

  - type: dropdown
    id: process_mode
    attributes:
      label: Process mode
      description: Procedure intensity (see doc/orchestrator/issue-process-modes.md). XS/S skip skeleton/BDD in body — derive from mode.
      options:
        - XS
        - S
        - M
        - L
        - XL
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Why this is needed
    validations:
      required: true

  - type: textarea
    id: behavioral_intent
    attributes:
      label: Behavioral Intent
      description: What the user should experience
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence outcome
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Testable completion conditions
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Non-goals / Out of scope
      description: Areas explicitly excluded

  - type: textarea
    id: regression_risks
    attributes:
      label: Regression Risks
      description: Existing behavior that could break

  - type: textarea
    id: appetite
    attributes:
      label: Appetite (optional)
      description: Time/scope budget hint — not a merge gate

  - type: textarea
    id: affected
    attributes:
      label: Affected
      description: Paths or components (one per line)
      placeholder: |
        apps/context-canvas/src/web/App.tsx
    validations:
      required: true

  - type: input
    id: task_record_path
    attributes:
      label: Task record path (optional)
      description: Obsidian or doc/orchestrator/task-record-template mirror
      placeholder: Projects/berry-pi-agent/tasks/T-000/00-index.md

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands to run (checkbox list)
      value: |
        - [ ] npm run test --workspace=@berry-pi/context-canvas
        - [ ] npm run typecheck --workspace=@berry-pi/context-canvas
    validations:
      required: true

  - type: textarea
    id: harness_breadcrumbs
    attributes:
      label: Harness breadcrumbs (optional)
      description: next_action and drill_down for the next agent session
      placeholder: |
        next_action: Implement skeleton in App.tsx
        drill_down: peer-runs/issue-<N>/peer-review-plan.md

  - type: textarea
    id: peer_review_hint
    attributes:
      label: Peer review hint (optional)
      description: PEPR notes — orchestrator runs Invoke-HarnessPhasePeerReview.ps1 at phase exit
      placeholder: |
        plan peer: agy Opus (Codex) or codex CLI (Cursor)
        implement peer: per process_mode; failure >= 2 for M+
        prompts: doc/orchestrator/issue-agent-prompts.md
